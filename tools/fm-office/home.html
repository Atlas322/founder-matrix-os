<!-- Мини хот = гэрийн орчмын БОДИТ гудамж (OSM, 5 км, /api/osm — cache ~/.fmos). Хэв маяг: A+B+C (архитектурын axonometric:
     цагаан бөөн хэлбэр + нимгэн зураас, гаа ногоон цэцэрлэг, шар талбай, цагаан мод, жижиг хүмүүс, улаан accent).
     Хурд: бүх барилга НЭГ geometry (merge), мод/хүн InstancedMesh, нэг сүүдэр. Уур амьсгал: өдөр · намар · бүрхэг · бороо · шөнө. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F3F2EE; --line:#1A1A1A; --accent:#D6453D; --muted:#7a776f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--line); font:400 14px/1.45 "Inter Tight", Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; transition:background .6s; }
  canvas { display:block; }
  .hud { position:fixed; top:64px; left:20px; z-index:3; background:#fff; border:1px solid var(--line); padding:16px 18px; width:290px; }
  .hud .eb { font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .hud h1 { margin:4px 0 6px; font-size:22px; font-weight:500; letter-spacing:-.01em; }
  .hud p { margin:0 0 10px; font-size:12.5px; color:var(--muted); }
  .hud .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .hud .lbl2 { font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:12px; }
  .hud button { font:500 12.5px "Inter Tight", Inter, system-ui, sans-serif; border:1px solid var(--line); background:#fff; padding:5px 10px; cursor:pointer; color:var(--line); }
  .hud button:hover, .hud button.on { background:var(--line); color:#fff; }
  .hud button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  #load { position:fixed; inset:0; display:grid; place-items:center; z-index:6; background:var(--paper); font:500 13px "Inter Tight", sans-serif; color:var(--muted); letter-spacing:.08em; transition:opacity .5s; }
  #fps { position:fixed; right:20px; bottom:16px; font:600 11px ui-monospace, monospace; color:var(--muted); z-index:3; }
  .panel { position:fixed; right:20px; top:64px; z-index:3; width:min(340px, calc(100vw - 40px)); max-height:calc(100vh - 100px); overflow:auto; background:#fff; border:1px solid var(--line); padding:18px 20px; display:none; }
  .panel.on { display:block; } .panel h2 { margin:0 0 8px; font-size:20px; font-weight:500; }
  .panel .x { float:right; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; font-size:12px; padding:2px 8px; }
  .panel a { color:var(--line); text-underline-offset:3px; } .panel a:hover { color:var(--accent); }
  .panel ul { padding-left:18px; margin:8px 0; } .panel li { margin:4px 0; } .panel small { color:var(--muted); }
  .stat { display:inline-block; margin:2px 18px 8px 0; } .stat b { display:block; font-size:26px; font-weight:500; }
  .attr { position:fixed; left:20px; bottom:12px; font-size:10.5px; color:var(--muted); z-index:3; }
  body.night .attr, body.night #fps { color:#8d93b8; }
  .clients { position:fixed; right:20px; bottom:16px; z-index:3; width:300px; max-height:46vh; overflow:auto; background:#fff; border:1px solid var(--line); padding:12px 14px; display:none; }
  .clients.on { display:block; } .clients h2 { margin:0 0 4px; font-size:16px; font-weight:500; } .clients h3 { margin:10px 0 2px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .clients button { display:block; width:100%; text-align:left; background:none; border:none; border-left:3px solid var(--accent); padding:5px 9px; margin:3px 0; cursor:pointer; font:inherit; color:var(--line); }
  .clients button:hover { background:#F3F2EE; } .clients small { display:block; color:var(--muted); font-size:11px; } .clients .un { border-left:3px dashed #bbb; padding:5px 9px; margin:3px 0; }
  .cpin { font:600 11.5px "Inter Tight", Inter, sans-serif; color:#fff; background:var(--accent); padding:3px 8px; white-space:nowrap; pointer-events:auto; cursor:pointer; transform:translateY(-6px); }
  .mini { position:absolute; top:8px; right:8px; width:24px; height:24px; border:1px solid var(--line); background:#fff; cursor:pointer; font:600 14px/1 "Inter Tight", sans-serif; padding:0; }
  .hud, .panel, .clients { position:fixed; } .hud.min > :not(.eb):not(h1):not(.mini) { display:none; } .hud.min h1 { margin-bottom:0; }
  .panel.min #pc > :not(h2) { display:none; } .clients.min > :not(h2):not(.mini) { display:none; }
  #walkhint { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:6; display:none; padding:8px 14px; background:#1A1A1A; color:#fff; font:500 13px "Inter Tight", sans-serif; cursor:pointer; }
  #walkhint b { display:inline-block; min-width:18px; margin-right:8px; padding:1px 5px; background:#D6453D; text-align:center; }
  #joy { position:fixed; left:24px; bottom:24px; width:120px; height:120px; border:1px solid #1A1A1A; border-radius:50%; background:rgba(255,255,255,.55); z-index:6; display:none; touch-action:none; }
  #joy i { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:#1A1A1A; }
  body.walking #joy.touch { display:block; }
  #fade { position:fixed; inset:0; background:var(--paper); opacity:0; pointer-events:none; z-index:5; }
  @media (max-width:700px) { .hud { width:auto; right:20px; } .hud p { display:none; } .panel { top:auto; bottom:16px; max-height:45vh; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { gsap } from 'gsap';
import { LABEL_CSS } from '/diagram.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches, MOBILE = innerWidth < 700;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.head.insertAdjacentHTML('beforeend', `<style>${LABEL_CSS}</style>`);

// ---------- уур амьсгалын палитр (Figma «04 · Барилга» 3:1193: A+B+C · намар · бүрхэг · бороо · шөнө noir) ----------
const MOODS = {
  day:      { bg: 0x1d3f8f, ground: 0xefe6d6, road: 0xd8cdbb, mass: 0xf7efe2, line: 0x1a1a1a, park: 0x3f7d4a, plaza: 0xf2c230, water: 0x2d6fb3, pitch: 0xc8452c,
              crown: [0x2f6a3b, 0x3f7d4a, 0x2a5a36, 0xd8432c], sun: 1.15, sunC: 0xfff4e6, hemi: 2.1, shadow: true, people: 0x3a3833, lit: 0 },
  autumn:   { bg: 0x1d3f8f, ground: 0xeee2cc, road: 0xd6c8b0, mass: 0xf6ead8, line: 0x221c16, park: 0xb08a2e, plaza: 0xe8a33d, water: 0x2d6fb3, pitch: 0xc8452c,
              crown: [0xe8a33d, 0xd9682e, 0xf2c14e, 0xb5482a, 0xe08a3a], sun: 1.35, sunC: 0xffdcae, hemi: 1.8, shadow: true, people: 0x3a2f28, lit: 0 },
  overcast: { bg: 0xe4e7ea, ground: 0xdfe2e4, road: 0xcdd1d5, mass: 0xf6f7f7, line: 0x23272b, park: 0xa7bf9a, plaza: 0xe2d29a, water: 0x8eaab8, pitch: 0xc98670,
              crown: [0xb8cc9c, 0xa3bd8b], sun: .25, sunC: 0xeef2f6, hemi: 2.9, shadow: false, people: 0x33373b, lit: .05 },
  rain:     { bg: 0x7f8a99, ground: 0x6f7a88, road: 0x5d6775, mass: 0xc9ced6, line: 0x14181f, park: 0x6f8d6a, plaza: 0xb59b5c, water: 0x4f6d84, pitch: 0x9a5c4c,
              crown: [0xc9a447, 0x7f9a5c, 0xb8642f], sun: .35, sunC: 0xdfe6f0, hemi: 1.6, shadow: false, people: 0x1b1f26, lit: .35, rain: true },
  snow:     { bg: 0xeef1f4, ground: 0xf7f8fa, road: 0xd4d8de, mass: 0xfdfdfd, line: 0x1d2430, park: 0xf2f4f6, plaza: 0xe9e4d6, water: 0xc9d8e2, pitch: 0xe8d6d0,
              crown: [0xffffff], bare: true, sun: .8, sunC: 0xf2f6ff, hemi: 2.4, shadow: true, people: 0x262c36, lit: .12, snowfall: true },
  dusk:     { dusk: true, bg: 0x6c5ba8, ground: 0x5a4c98, road: 0x4a3f88, mass: 0xf3a58c, line: 0x241d55, park: 0x3f3f88, plaza: 0x7c5ba0, water: 0x2b2e78, pitch: 0xc46a6a,
              crown: [0x2f2f74, 0x3a3a82], sun: 1.1, sunC: 0xffb48e, hemi: 1.0, shade: 0x403c96, shadow: true, people: 0x1e1a44, lit: .3, lampsOn: true, play: 0xb0606e },
  night:    { bg: 0x161d44, ground: 0x232c63, road: 0x2e3874, mass: 0x3b4690, line: 0x0d1230, park: 0x284c4f, plaza: 0x40406a, water: 0x111d50, pitch: 0x4a2c50,
              crown: [0x2c3a72, 0x26346a], sun: .7, sunC: 0x9fb2ff, hemi: .95, shadow: true, people: 0x0b0e1e, lit: .36, night: true, mass: 0x24306b },
};
let mood = 'day', baseBg = 0xf3f2ee, smog = 0;
// Утаа (PM2.5) → манан: алсын барилгууд бүдгэрч, өнгө нь бор саарал руу. 12 мкг/м³-ээс доош бол цэвэр.
function applySmog() {
  const P = MOODS[mood] || MOODS.day, sc = new THREE.Color(P.night ? 0x3a3448 : 0xa39684), bg = new THREE.Color(baseBg).lerp(sc, smog * .55);
  const d = camera.position.distanceTo(controls.target);
  scene.fog = new THREE.Fog(new THREE.Color(baseBg).lerp(sc, smog * .9), d - 250 + (1 - smog) * 1600, d + 250 + (1 - smog) * 4200);
  scene.background = bg; renderer.setClearColor(bg); document.body.style.background = '#' + bg.getHexString();
  const hz = document.getElementById('haze'); if (hz) { hz.style.opacity = (smog * .55).toFixed(2); hz.style.mixBlendMode = P.night ? 'screen' : 'multiply'; }   // ойрын утаа (дэлгэц бүхэлдээ)
}

// ---------- renderer, сцен, ортографик axonometric камер ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const labels = new CSS2DRenderer(); labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'fixed', top: 0, left: 0, pointerEvents: 'none' });
document.body.appendChild(labels.domElement);
const scene = new THREE.Scene();
const SPAN = 520;                                            // эхний харагдах өргөн (м)
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -6000, 6000);
function frustum() { const a = innerWidth / innerHeight; Object.assign(camera, { left: -SPAN * a / 2, right: SPAN * a / 2, top: SPAN / 2, bottom: -SPAN / 2 }); camera.updateProjectionMatrix(); }
frustum(); camera.position.set(800, 640, 800);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.screenSpacePanning = false; controls.minZoom = .055; controls.maxZoom = 7;
controls.minPolarAngle = .45; controls.maxPolarAngle = 1.1;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
const hemi = new THREE.HemisphereLight(0xffffff, 0xe4e1da, 2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.castShadow = true; sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = .08; scene.add(sun, sun.target);
const SUN_DIR = new THREE.Vector3(.78, .5, -.38).normalize();   // сүүдэр камер тийш (баруун доош) унана

// ---------- материал ----------
// Poster хэв маяг: гэрлийн 3 шат (сүүдэр · дунд · гэрэлтэй), хооронд нь хатуу хил — таны лавлагаа (halftone poster) шиг.
const TOON = new THREE.DataTexture(new Uint8Array([40, 150, 255]), 3, 1, THREE.RedFormat); TOON.minFilter = TOON.magFilter = THREE.NearestFilter; TOON.needsUpdate = true;
const Toon = (o = {}) => new THREE.MeshToonMaterial({ gradientMap: TOON, ...o });
const mBuild = Toon({ vertexColors: true, side: THREE.DoubleSide, shadowSide: THREE.FrontSide });
const uRoof = { value: new THREE.Color(1, 1, 1) }, uRoofMix = { value: 0 };
const uGlow = { value: 0 }, uWinMix = { value: .5 }, uWinCol = { value: new THREE.Color(.72, .78, .84) }, uLit = { value: new THREE.Color(1, .72, .36) };
// Цонхны текстур (procedural, зураггүй): ханан дээр дэлхийн координатаар 3.2×3.1 м-ийн тор → өдөр шилэн цонх, шөнө зарим нь гэрэлтэнэ.
mBuild.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, { uGlow, uWinMix, uWinCol, uLit, uRoof, uRoofMix });
  sh.vertexShader = 'attribute float glow;\nattribute float base;\nvarying float vGlow;\nvarying float vBase;\nvarying vec3 vWP;\nvarying vec3 vWN;\n' + sh.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\nvGlow = glow; vBase = base; vWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normal;');
  sh.fragmentShader = 'uniform vec3 uRoof; uniform float uRoofMix; uniform float uGlow; uniform float uWinMix; uniform vec3 uWinCol; uniform vec3 uLit;\nvarying float vGlow;\nvarying float vBase;\nvarying vec3 vWP;\nvarying vec3 vWN;\n' + sh.fragmentShader
    .replace('#include <color_fragment>', `#include <color_fragment>
      float wall = 1.0 - step(0.5, abs(vWN.y));
      float along = abs(vWN.x) > abs(vWN.z) ? vWP.z : vWP.x;
      float u = fract(along / 3.2), v = fract((vWP.y - vBase) / 3.1);
      float win = wall * step(0.26, u) * step(u, 0.74) * step(0.30, v) * step(v, 0.80) * step(2.4, vWP.y - vBase);
      diffuseColor.rgb = mix(diffuseColor.rgb, uRoof, (1.0 - wall) * uRoofMix);
      diffuseColor.rgb = mix(diffuseColor.rgb, uWinCol, win * uWinMix);
      float band = wall * (1.0 - step(0.07, fract((vWP.y - vBase) / 3.1))) * step(3.0, vWP.y - vBase);
      diffuseColor.rgb *= 1.0 - band * 0.08;`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float flick = step(0.45, fract(sin(dot(floor(vec2(along / 3.2, (vWP.y - vBase) / 3.1)), vec2(12.9898, 78.233))) * 43758.5453));
      totalEmissiveRadiance += uLit * vGlow * uGlow * win * flick + diffuseColor.rgb * vGlow * uGlow * 0.12;`);
};   // OSM-ийн эргэлтийн чиглэл холимог
const mLine = new THREE.LineBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: .85 });
const mFlat = k => Toon({ color: 0xffffff, polygonOffset: true, polygonOffsetFactor: -k, polygonOffsetUnits: -k * 4 });
const mats = { ground: mFlat(0), road: mFlat(3), park: mFlat(1), plaza: mFlat(2), water: mFlat(4), pitch: mFlat(2), playground: mFlat(2) };
const PLAY = { day: 0xe8935c, autumn: 0xd98450, overcast: 0xcf8a6a, rain: 0x9b5f48, snow: 0xe6c9bd, night: 0x5a3046 };
const mContour = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .12 });
const mDash = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 4, transparent: true, opacity: .85 });

// ---------- газрын өндөр: Terrarium DEM (z12, ~30 м), /api/dem (cache) → H(x,z) метр, гэрийн өндрөөс хамааралтай ----------
let DEM = null, H0 = 0;
async function loadDEM(lat0, lon0, R) {
  const Z = 12, n = 2 ** Z, kx = 111320 * Math.cos(lat0 * Math.PI / 180), kz = 110540;
  const tx = lon => (lon + 180) / 360 * n, ty = lat => (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
  const lonA = lon0 - (R + 600) / kx, lonB = lon0 + (R + 600) / kx, latA = lat0 + (R + 600) / kz, latB = lat0 - (R + 600) / kz;
  const x0 = Math.floor(tx(lonA)), x1 = Math.floor(tx(lonB)), y0 = Math.floor(ty(latA)), y1 = Math.floor(ty(latB));
  const W = (x1 - x0 + 1) * 256, Hh = (y1 - y0 + 1) * 256, cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
  const g = cv.getContext('2d', { willReadFrequently: true });
  await Promise.all([...Array(x1 - x0 + 1)].flatMap((_, i) => [...Array(y1 - y0 + 1)].map((_, j) => new Promise(res => {
    const im = new Image(); im.onload = () => { g.drawImage(im, i * 256, j * 256); res(); }; im.onerror = res; im.src = `/api/dem?z=${Z}&x=${x0 + i}&y=${y0 + j}`; }))));
  const px = g.getImageData(0, 0, W, Hh).data, e = new Float32Array(W * Hh);
  for (let k = 0; k < e.length; k++) e[k] = px[k * 4] * 256 + px[k * 4 + 1] + px[k * 4 + 2] / 256 - 32768;
  DEM = { e, W, Hh, f: (x, z) => { const lon = lon0 + x / kx, lat = lat0 - z / kz; return [(tx(lon) - x0) * 256, (ty(lat) - y0) * 256]; } };
  H0 = 0; H0 = H(0, 0);
