<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM Office</title>
<link rel="icon" href="data:,">
<style>
:root{--paper:#E9DCC3;--ink:#1d1a16;--char:#2b2723;--ochre:#c8892f;--amber:#f2b45a;--blue:#1B5CFF;--green:#2e9b55;--mute:#6f6556;--card:#f6eedd;--line:#cdbb98}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
/* хямд halftone мэдрэмж */
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(#3a2c18 0.8px,transparent 1px);background-size:5px 5px;mix-blend-mode:multiply}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:rgba(233,220,195,.88);backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
h1{margin:0 6px 0 0;font-size:17px;letter-spacing:.5px}
.stat{font-size:13px;color:var(--mute)}
.stat b{color:var(--ink)}
.sp{flex:1}
button{font:inherit;font-size:13px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
button.on{background:var(--ink);color:var(--paper)}
.floors{display:flex;gap:6px;flex-wrap:wrap}
/* CSS2D labels */
.lbl{pointer-events:none;font-size:11px;font-weight:600;background:rgba(246,238,221,.92);border:1.5px solid var(--ink);border-radius:6px;padding:2px 6px;white-space:nowrap;transform:translateY(-4px)}
.lbl .chip{display:inline-block;margin-left:4px;padding:0 5px;border-radius:999px;color:#fff;font-size:10px}
.lbl.dim{opacity:.55}
.lbl.floor{font-size:12px;background:var(--ink);color:var(--paper)}
.alb{pointer-events:none;font-size:10px;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 5px;white-space:nowrap;opacity:.85}
.bubble{pointer-events:none;max-width:200px;font-size:11px;background:#fff;border:2px solid var(--blue);border-radius:10px;padding:4px 8px;white-space:normal;box-shadow:2px 2px 0 var(--ink);animation:pop .25s ease-out}
.bubble.ok{border-color:var(--green)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* card */
#card{position:fixed;z-index:20;top:64px;right:16px;width:300px;max-height:calc(100% - 80px);overflow:auto;background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:14px 16px;box-shadow:5px 5px 0 var(--ink);display:none}
#card.show{display:block}
#card h2{margin:0 24px 6px 0;font-size:16px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0;font-size:13px}
#card dt{color:var(--mute)}
#card dd{margin:0}
#card .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:18px;padding:0 4px}
#card a{color:var(--blue);font-weight:600}
#card ul{margin:4px 0 0;padding-left:18px}
#tip{position:fixed;z-index:15;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:3px 7px;border-radius:5px;display:none}
#feed{position:fixed;z-index:9;left:16px;bottom:16px;width:300px;max-height:42%;overflow:auto;background:rgba(246,238,221,.95);border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:8px 10px;display:none}
#feed.open{display:block}
#feed h3{margin:0 0 4px;font-size:13px}
#feed p{margin:4px 0;font-size:12px;color:var(--mute)}
#feed ul{list-style:none;margin:0;padding:0}
#feed li{font-size:12px;padding:5px 4px;border-top:1px solid var(--line);cursor:pointer;display:grid;gap:1px}
#feed li:hover{background:#efe3c9}
#feed li.ok b{color:var(--green)}
#feed .t{color:var(--mute);font-size:11px}
#feed .x2{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb.human{background:var(--ochre)}
#err{position:fixed;bottom:12px;left:16px;z-index:12;font-size:12px;color:#a33}
@media (max-width:600px){
  #feed{left:0;right:0;bottom:0;width:auto;max-height:40%;border-radius:14px 14px 0 0;border-width:3px 0 0;box-shadow:none}
  header{padding:8px 16px;gap:6px}
  h1{font-size:15px}
  .sp{display:none}
  .floors{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .floors button{flex:none}
  header button{padding:3px 9px}
  #card{top:auto;bottom:0;left:0;right:0;width:auto;max-height:55%;border-radius:14px 14px 0 0;border-width:3px 0 0;box-shadow:none}
  .lbl{font-size:10px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <h1>FM Office</h1>
  <span class="stat">ажиллаж <b id="nWork">0</b> · сул <b id="nIdle">0</b> · яриа <b id="nTalk">0</b></span>
  <span class="sp"></span>
  <div class="floors" id="floors"></div>
  <button id="feedBtn" title="Яриаг харуулах/нуух">Яриа</button>
  <button id="demo" title="Жишээ яриа тоглуулах">Demo</button>
  <button id="reset">Харагдац</button>
</header>
<div id="stage"></div>
<div id="tip"></div>
<aside id="card" role="dialog"><button class="x" id="close" aria-label="Хаах">×</button><div id="cardBody"></div></aside>
<aside id="feed" class="open"><h3>Яриа</h3><p id="feedEmpty">Сүүлийн 24 цагт яриа алга — «Demo»-г асаа.</p><ul id="feedList"></ul></aside>
<div id="err"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
