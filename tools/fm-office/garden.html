<style>
  /* Zen цэцэрлэг = миний хот. Павильон бүр Second Brain-ий нэг хэсэг (PARA). Asset: Kenney (CC0) + кодоор хийсэн элс, өвс, павильон. */
  :root { --ink:#1f1d1a; --paper:#f4efe2; --red:#c8432f; }
  html, body { margin:0; height:100%; overflow:hidden; background:#e9dcc4; font-family:"Inter Tight", system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; }
  .hud { position:fixed; left:20px; top:20px; width:270px; padding:14px 16px; background:rgba(244,239,226,.82); backdrop-filter:blur(6px); border:1px solid rgba(31,29,26,.5); }
  .hud h1 { margin:2px 0 6px; font:600 19px "Inter Tight"; } .hud p { margin:0; font-size:12.5px; line-height:1.5; opacity:.75; }
  .hud.min p { display:none; } .hud .mini { position:absolute; top:8px; right:8px; width:22px; height:22px; border:1px solid rgba(31,29,26,.5); background:transparent; cursor:pointer; padding:0; }
  .eb { font:600 10.5px ui-monospace, monospace; letter-spacing:.14em; text-transform:uppercase; opacity:.55; }
  #hint { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); display:none; padding:9px 16px; background:rgba(31,29,26,.88); color:var(--paper); font-size:13.5px; cursor:pointer; letter-spacing:.01em; }
  #hint b { display:inline-block; margin-right:10px; padding:1px 7px; background:var(--red); }
  .panel { position:fixed; right:20px; top:20px; width:min(380px, 90vw); max-height:82vh; overflow:auto; padding:20px 22px; background:rgba(244,239,226,.95); border:1px solid rgba(31,29,26,.5); display:none; }
  .panel.on { display:block; } .panel h2 { margin:0 0 4px; font:600 20px "Inter Tight"; } .panel li { margin:5px 0; font-size:13.5px; }
  .panel .x { float:right; border:1px solid rgba(31,29,26,.5); background:transparent; cursor:pointer; font:inherit; font-size:12px; padding:3px 8px; }
  .panel small, .panel .sub { opacity:.6; } .panel .sub { font-size:12px; margin:0 0 12px; }
  .panel .st { display:inline-block; min-width:62px; font:600 10px ui-monospace, monospace; letter-spacing:.08em; text-transform:uppercase; opacity:.55; }
  .panel .st.active { color:var(--red); opacity:1; }
  .lbl { padding:3px 9px; background:rgba(31,29,26,.78); color:var(--paper); font:500 12px "Inter Tight"; letter-spacing:.04em; white-space:nowrap; pointer-events:none; }

  #joy { position:fixed; left:24px; bottom:24px; width:120px; height:120px; border:1px solid rgba(31,29,26,.5); border-radius:50%; background:rgba(244,239,226,.45); display:none; touch-action:none; }
  #joy i { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:var(--ink); }
  #joy.touch { display:block; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:#e9dcc4; font:600 11px ui-monospace, monospace; letter-spacing:.2em; transition:opacity .8s; z-index:20; }
  #fps { position:fixed; right:12px; bottom:8px; font:11px ui-monospace, monospace; opacity:.45; }
  @media (max-width:700px) { .hud { width:auto; right:20px; } .hud p { display:none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches, MOBILE = innerWidth < 700;
// Quality түвшин (Bruno/summer-afternoon шиг): ?q=low|high, анхдагч нь утсанд low. low = PCF сүүдэр, DoF/bloom/SMAA-гүй, цөөн өвс
const QUALITY = new URLSearchParams(location.search).get('q') || (MOBILE ? 'low' : 'high'), HIGH = QUALITY === 'high';
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();   // тогтвортой санамсаргүй (байршил үргэлж ижил)

// ── Өнгөний зохицол: хөвд ногоон · элсэн шар · модны хүрэн · шифер саарал · агчны улаан (FM accent) ──
const PAL = {
  day:   { sky: 0x9ec9df, hor: 0xf4e6c8, sun: 0xffe2b0, sunI: 2.4, hemi: 1.15, gnd: 0x4f7a3a, moss: 0x6f9a48, tip: 0xa9c46a, sand: 0xf1ece0, fog: 0xe9dcc4, exp: 1.0, bloom: .18, dir: [40, 32, 14], lantern: 0 },
  dusk:  { sky: 0x5d5a9a, hor: 0xf3a77e, sun: 0xffa66b, sunI: 2.0, hemi: .7, gnd: 0x4a5e36, moss: 0x66803e, tip: 0xe0a65a, sand: 0xe9cdb0, fog: 0xd99a82, exp: 1.0, bloom: .5, dir: [50, 14, -10], lantern: 1 },
  night: { sky: 0x101a3a, hor: 0x34406e, sun: 0xa9bcff, sunI: .8, hemi: .55, gnd: 0x26392e, moss: 0x3c5a42, tip: 0x6a8a6a, sand: 0xb8bfd0, fog: 0x1c2648, exp: 1.1, bloom: .9, dir: [-20, 40, 30], lantern: 1 },
};
const hr = new Date().getHours() + new Date().getMinutes() / 60, Q = new URLSearchParams(location.search).get('t');   // ?t=day|dusk|night
const P = PAL[Q] || (hr >= 20.5 || hr < 6 ? PAL.night : (hr >= 17.5 || hr < 7.5) ? PAL.dusk : PAL.day), NIGHT = P === PAL.night;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, HIGH ? 2 : 1.25)); renderer.shadowMap.enabled = true;
renderer.shadowMap.type = HIGH ? THREE.VSMShadowMap : THREE.PCFSoftShadowMap;   // VSM = зөөлөн, бүдэг захтай сүүдэр (summer-afternoon)
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = P.exp;
document.body.prepend(renderer.domElement);
const labels = new CSS2DRenderer(); Object.assign(labels.domElement.style, { position: 'fixed', top: 0, left: 0, pointerEvents: 'none' }); document.body.appendChild(labels.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(P.fog, 30, 150);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 600);

// тэнгэр
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { a: { value: new THREE.Color(P.sky) }, b: { value: new THREE.Color(P.hor) }, night: { value: NIGHT ? 1 : 0 } },
  vertexShader: 'varying vec3 vp; void main(){ vp = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform vec3 a,b; uniform float night; varying vec3 vp;
    float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }
    void main(){ vec3 c = mix(b, a, smoothstep(-.02, .45, vp.y));
      if (night > .5) { vec3 q = floor(vp * 260.); float s = step(.9975, h(q)) * smoothstep(.05, .3, vp.y); c += s * .9; }
      gl_FragColor = vec4(c, 1.); }` })));
// холын уулс: давхар силуэт (Windland маягийн гүн)
for (const [r, h, k, sh] of [[230, 60, .55, 0], [190, 38, .35, 1.3], [160, 22, .18, 2.1]]) {
  const g = new THREE.CylinderGeometry(r, r, 1, 128, 1, true), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) if (p.getY(i) > 0) { const a = Math.atan2(p.getZ(i), p.getX(i)); p.setY(i, h * (.45 + .35 * Math.sin(a * 3 + sh) + .2 * Math.sin(a * 11 + sh * 2))); } else p.setY(i, -2);
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: new THREE.Color(P.fog).lerp(new THREE.Color(P.sky), k * .6).multiplyScalar(1 - k * .25), side: THREE.BackSide, fog: false })));
}

const hemi = new THREE.HemisphereLight(P.sky, P.gnd, P.hemi); scene.add(hemi);
const sun = new THREE.DirectionalLight(P.sun, P.sunI); sun.castShadow = true;
sun.shadow.mapSize.set(HIGH ? 2048 : 1024, HIGH ? 2048 : 1024); if (HIGH) { sun.shadow.radius = 6; sun.shadow.blurSamples = 16; } Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 200 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .05;
scene.add(sun, sun.target);

// ── Газар ──
const R = 46;                                                    // цэцэрлэгийн радиус
const POND = { x: 20, z: 17, r: 7.5 }, SAND = { x: 0, z: 0, r: 12.5 };
const H = (x, z) => { const r = Math.hypot(x, z); let h = Math.sin(x * .07) * .35 + Math.cos(z * .06 + 1) * .3 + Math.max(0, r - R + 8) * .35;
  const dp = Math.hypot(x - POND.x, z - POND.z); if (dp < POND.r + 1.5) h -= (1 - Math.min(1, dp / (POND.r + 1.5))) ** .7 * 1.2;
  const ds = Math.hypot(x - SAND.x, z - SAND.z); if (ds < SAND.r + 2) h = THREE.MathUtils.lerp(h, .05, 1 - THREE.MathUtils.smoothstep(ds, SAND.r, SAND.r + 2));
  return h; };
const gg = new THREE.PlaneGeometry(260, 260, 200, 200); gg.rotateX(-Math.PI / 2);
{ const p = gg.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, H(p.getX(i), p.getZ(i))); gg.computeVertexNormals(); }
const ground = new THREE.Mesh(gg, new THREE.MeshLambertMaterial({ color: P.gnd })); ground.receiveShadow = true; scene.add(ground);

// karesansui: хүрзээр зурсан элс — чулуу тойрсон цагираг + шулуун зураас (shader)
const STONES = [[-4, -2.5, 2.2], [3.5, 1.5, 1.6], [1, -6.5, 1.2]];
const sandM = new THREE.ShaderMaterial({ fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { c: { value: new THREE.Color(P.sand) }, sunC: { value: new THREE.Color(P.sun) }, st: { value: STONES.map(s => new THREE.Vector3(...s)) } }]),
  vertexShader: `#include <fog_pars_vertex>
    varying vec2 vw; void main(){ vec4 w = modelMatrix * vec4(position,1.); vw = w.xz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `#include <fog_pars_fragment>
    uniform vec3 c, sunC; uniform vec3 st[3]; varying vec2 vw;
    void main(){ float d = 1e3;
      for (int i = 0; i < 3; i++){ float q = length(vw - st[i].xy) - st[i].z * .7; d = min(d, q); }
      float v = d < 3.2 ? d * 4.2 : vw.x * 4.2;                                         // чулууны орчим цагираг, бусад нь шулуун ховил
      float g = .5 + .5 * sin(v * 3.14159);
      vec3 col = c * (.74 + .26 * g); col = mix(col, col * sunC, .08);
      float edge = smoothstep(${(SAND.r - .3).toFixed(1)}, ${SAND.r.toFixed(1)}, length(vw)); col = mix(col, col * .8, edge);
      gl_FragColor = vec4(col, 1.);
      #include <fog_fragment>
    }` });
{ const s = new THREE.Mesh(new THREE.CircleGeometry(SAND.r, 96), sandM); s.rotation.x = -Math.PI / 2; s.position.set(0, .07, 0); scene.add(s);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(SAND.r + .15, .22, 6, 96), new THREE.MeshLambertMaterial({ color: 0x8c8679 })); rim.rotation.x = Math.PI / 2; rim.position.y = .1; scene.add(rim); }

// цөөрөм
const water = new THREE.Mesh(new THREE.CircleGeometry(POND.r, 64), new THREE.MeshPhongMaterial({ color: NIGHT ? 0x1d2a55 : 0x4f8a8c, shininess: 120, specular: 0xffffff, transparent: true, opacity: .88 }));
water.rotation.x = -Math.PI / 2; water.position.set(POND.x, -.35, POND.z); scene.add(water);
// koi загас
const KOI = 9, koiM = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.12, .45, 3, 6).rotateZ(Math.PI / 2), new THREE.MeshLambertMaterial(), KOI);
for (let i = 0; i < KOI; i++) koiM.setColorAt(i, new THREE.Color([0xe8742c, 0xf4efe2, 0xc8432f][i % 3])); scene.add(koiM);
const koi = Array.from({ length: KOI }, () => ({ r: 1.5 + rnd() * 4.5, a: rnd() * 6.28, v: (.15 + rnd() * .25) * (rnd() < .5 ? 1 : -1) }));

// ── Павильоны тэгш өнцөгт, зам (өвс, мөргөлдөөнд) ──
const BUILD = [], PATHS = [];
const inBuild = (x, z, m = 0) => BUILD.some(b => Math.abs(x - b.x) < b.w / 2 + m && Math.abs(z - b.z) < b.d / 2 + m);
const onPath = (x, z) => PATHS.some(([a, b]) => { const dx = b[0] - a[0], dz = b[1] - a[1], t = THREE.MathUtils.clamp(((x - a[0]) * dx + (z - a[1]) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(x - a[0] - dx * t, z - a[1] - dz * t) < .9; });

// ── Хөвд өвс (shader, салхи) — элс, ус, павильон, замаас гадна ──
const uT = { value: 0 }, uPlayer = { value: new THREE.Vector3() };
function makeGrass() {
  const N = HIGH ? 110000 : 45000, bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute([-.06, 0, 0, .06, 0, 0, -.035, .45, 0, .035, .45, 0, 0, .9, 0], 3)); bg.setIndex([0, 1, 2, 2, 1, 3, 2, 3, 4]);
  const offs = new Float32Array(N * 4); let n = 0;
  for (let i = 0; n < N && i < N * 4; i++) { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * (R + 4), x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - SAND.x, z - SAND.z) < SAND.r + .6 || Math.hypot(x - POND.x, z - POND.z) < POND.r + .4 || inBuild(x, z, .4) || onPath(x, z)) continue;
    offs.set([x, H(x, z), z, rnd()], n * 4); n++; }
  const ig = new THREE.InstancedBufferGeometry().copy(bg); ig.instanceCount = n; ig.setAttribute('aOff', new THREE.InstancedBufferAttribute(offs, 4));
  const m = new THREE.ShaderMaterial({ side: THREE.DoubleSide, fog: true,
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { c1: { value: new THREE.Color(P.moss) }, c2: { value: new THREE.Color(P.tip) }, base: { value: new THREE.Color(P.gnd) } }]),
    vertexShader: `#include <fog_pars_vertex>
      attribute vec4 aOff; uniform float uT; uniform vec3 uPlayer; varying float vH; varying float vR;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
      void main(){ float a = aOff.w * 6.2832, s = .28 + aOff.w * .34; vH = position.y / .9; vR = aOff.w;
        vec3 p = position * vec3(1., s, 1.); p.xz = mat2(cos(a), -sin(a), sin(a), cos(a)) * p.xz; vec3 w = p + aOff.xyz;
        float wind = noise(aOff.xz * .07 + vec2(uT * .3, uT * .1)) * 1.1 - .3, k = vH * vH;
        w.x += (wind * .3 + sin(uT * 2. + aOff.x * .5) * .04) * k; w.z += wind * .14 * k;
        vec2 d = w.xz - uPlayer.xz; float dl = length(d); w.xz += normalize(d + .0001) * max(0., 1. - dl) * .35 * k;
        vec4 mvPosition = modelViewMatrix * vec4(w, 1.); gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `#include <fog_pars_fragment>
      uniform vec3 c1, c2, base; varying float vH; varying float vR;
      void main(){ vec3 c = mix(base, mix(c1, c2, vR * .6), smoothstep(0., 1., vH)); gl_FragColor = vec4(c, 1.);
      #include <fog_fragment>
      }` });
  m.uniforms.uT = uT; m.uniforms.uPlayer = uPlayer;
  const g = new THREE.Mesh(ig, m); g.frustumCulled = false; scene.add(g);
}

// ── Asset ачаалагч (Kenney CC0) — өндрөөр нь хэмжээ тааруулж, сүүдэр асаана ──
const loader = new GLTFLoader(), cache = {};
// Kenney-ийн материалыг палитрт оруулна: агч = accent улаан, хулс = залуу ногоон, их бие = хар хүрэн (арын гэрэлд ч өнгөө алдахгүй)
const RECOLOR = { leafsFall: new THREE.MeshLambertMaterial({ color: 0xd8462e, emissive: 0x5a120a, emissiveIntensity: .35 }),
  grass: new THREE.MeshLambertMaterial({ color: 0x8fae4f, emissive: 0x1c2a0c, emissiveIntensity: .3 }), woodBirch: new THREE.MeshLambertMaterial({ color: 0x5a3a2a }) };
const glb = p => cache[p] ??= new Promise((ok, no) => loader.load('/assets/kenney/' + p, g => ok(g), undefined, no));
async function put(p, x, z, { h = null, len = null, s = 1, ry = 0, y = null, parent = scene, tint = null } = {}) {
  try { const g = await glb(p), o = g.scene.clone(true);
    const sz = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()); o.scale.setScalar(len ? len / Math.max(sz.x, sz.z) : h ? h / sz.y : s);
    o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; const rc = RECOLOR[m.material.name]; if (rc && p.startsWith('nature/')) m.material = rc; if (tint) { m.material = m.material.clone(); m.material.color.multiply(new THREE.Color(tint)); } } });
    o.position.set(x, y ?? (parent === scene ? H(x, z) : 0), z); o.rotation.y = ry; parent.add(o); return o;
  } catch (e) { console.warn('asset', p, e); } }

// ── Зам: чулуун гишгүүр (павильон бүрийг элстэй холбоно) ──
const stoneM = new THREE.MeshLambertMaterial({ color: 0xb9b2a3 });
function path(a, b) { PATHS.push([a, b]); const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.floor(L / 1.25);
  for (let i = 0; i <= n; i++) { const t = i / n, x = a[0] + (b[0] - a[0]) * t + Math.sin(t * 9) * .25, z = a[1] + (b[1] - a[1]) * t + Math.cos(t * 7) * .25;
    const s = new THREE.Mesh(new THREE.CylinderGeometry(.42 + rnd() * .15, .5, .16, 8), stoneM); s.position.set(x, H(x, z) + .03, z); s.rotation.y = rnd() * 3; s.receiveShadow = true; scene.add(s); } }

// ── Павильон (кодоор): чулуун суурь, модон шал, багана, цаасан хана (шөнө гэрэлтэнэ), муруй дээвэр ──
const woodM = new THREE.MeshLambertMaterial({ color: 0x7a4e33 }), woodD = new THREE.MeshLambertMaterial({ color: 0x4a2f22 }), roofM = new THREE.MeshLambertMaterial({ color: 0x3a3d47, side: THREE.DoubleSide });
const baseM = new THREE.MeshLambertMaterial({ color: 0x9a9384 }), shojiM = new THREE.MeshLambertMaterial({ color: 0xf4efe2, emissive: 0xffb35c, emissiveIntensity: P.lantern ? .75 : 0 });
const PAV = [];
function pavilion(key, name, sub, x, z, w, d, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, H(x, z), z); g.rotation.y = ry; scene.add(g);
  const sw = Math.abs(Math.sin(ry)) > .5; BUILD.push({ x, z, w: sw ? d + 1.6 : w + 1.6, d: sw ? w + 1.6 : d + 1.6 });

// DoF: дүр дээр фокуслаж, ойр/холыг бүдгэрүүлнэ → жижиг diorama (tilt-shift) мэдрэмж
const bokeh = new BokehPass(scene, camera, { focus: 11, aperture: .0022, maxblur: .007 }); bokeh.enabled = HIGH && !REDUCED; composer.addPass(bokeh);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), P.bloom, .6, .82); bloomPass.enabled = HIGH; composer.addPass(bloomPass);
composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null }, warm: { value: NIGHT ? -.02 : .012 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float warm; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); c.rgb += vec3(warm, warm * .4, -warm);
      float v = smoothstep(.95, .35, length(vUv - .5) * 1.25); c.rgb *= mix(.78, 1., v); gl_FragColor = c; }` }));
composer.addPass(new OutputPass());
const smaa = new SMAAPass(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio()); smaa.enabled = HIGH; composer.addPass(smaa);

function size() { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
size(); addEventListener('resize', size);
const clock = new THREE.Clock(), V = new THREE.Vector3(), ONE = new THREE.Vector3(1, 1, 1), M4 = new THREE.Matrix4(), Qn = new THREE.Quaternion(), E = new THREE.Euler(); let fr = 0, last = performance.now();
const blocked = (x, z) => Math.hypot(x - POND.x, z - POND.z) < POND.r - .2 && !(Math.abs(z - POND.z) < 1.2 && Math.abs(x - POND.x + 2) < POND.r)   // гүүрээр гарна
  || Math.hypot(x, z) > R - 3 || STONES.some(s => Math.hypot(x - s[0], z - s[1]) < s[2] * .75);
window.garden = { WK, cam, ZONES, PAV, scene, bokeh, QUALITY };
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime; uT.value = REDUCED ? 0 : t;
  const K = WK.keys; let f = (K.has('w') || K.has('arrowup') ? 1 : 0) - (K.has('s') || K.has('arrowdown') ? 1 : 0), r = (K.has('d') || K.has('arrowright') ? 1 : 0) - (K.has('a') || K.has('arrowleft') ? 1 : 0);
  if (WK.joy[0] || WK.joy[1]) { f = -WK.joy[1]; r = WK.joy[0]; }
  const fx = -Math.cos(cam.az), fz = -Math.sin(cam.az), rx = -fz, rz = fx;
  let mx = fx * f + rx * r, mz = fz * f + rz * r; const l = Math.hypot(mx, mz), moving = l > .05 && !WK.sit, run = moving && (K.has('shift') || (l > .9 && (WK.joy[0] || WK.joy[1])));
  if (moving) { const sp = (run ? 5.2 : 2.1) * Math.min(1, l); mx /= l; mz /= l; const nx = WK.x + mx * sp * dt, nz = WK.z + mz * sp * dt;
    if (!blocked(nx, nz)) { WK.x = nx; WK.z = nz; } else if (!blocked(nx, WK.z)) WK.x = nx; else if (!blocked(WK.x, nz)) WK.z = nz;
    const ty = Math.atan2(mx, mz); let d = ty - WK.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); WK.yaw += d * Math.min(1, dt * 10); }
  if (ANIM.mixer) { play(WK.sit ? 'sit' : moving ? (run ? 'sprint' : 'walk') : 'idle'); ANIM.mixer.update(dt); }
  const inside = BUILD.some(b => Math.abs(WK.x - b.x) < b.w / 2 - .8 && Math.abs(WK.z - b.z) < b.d / 2 - .8);
  const onBridge = Math.abs(WK.z - POND.z) < 1.2 && Math.abs(WK.x - POND.x + 2) < POND.r;
  const y = onBridge ? Math.max(H(WK.x, WK.z), .35 + Math.cos((WK.x - POND.x + 2) / POND.r * 1.57) * .9) : H(WK.x, WK.z) + (inside ? .55 : 0);
  me.position.set(WK.x, y, WK.z); me.rotation.y = WK.yaw; uPlayer.value.set(WK.x, y, WK.z);
  V.set(WK.x + Math.cos(cam.az) * Math.cos(cam.el) * cam.dist, y + 1.2 + Math.sin(cam.el) * cam.dist, WK.z + Math.sin(cam.az) * Math.cos(cam.el) * cam.dist);
  V.y = Math.max(V.y, H(V.x, V.z) + 1); camera.position.lerp(V, Math.min(1, dt * 5)); camera.lookAt(WK.x, y + 1.1, WK.z);
  sun.position.set(WK.x + P.dir[0], P.dir[1], WK.z + P.dir[2]); sun.target.position.set(WK.x, 0, WK.z);
  if (!REDUCED) {
    if (leaves) { const lp = leaves.userData.p; for (let i = 0; i < lp.length; i++) { const p = lp[i]; p.y -= dt * .55 * p.s; p.x += Math.sin(t * .7 + i) * dt * .5 + dt * .35; p.z += Math.cos(t * .5 + i) * dt * .3; p.r += dt * 2 * p.s;
        if (p.y < H(p.x, p.z) + .05) { p.y = 10 + rnd() * 6; p.x = WK.x + (rnd() - .5) * 60; p.z = WK.z + (rnd() - .5) * 60; }
        Qn.setFromEuler(E.set(p.r, p.r * .7, p.r * .3)); M4.compose(V.set(p.x, p.y, p.z), Qn, ONE); leaves.setMatrixAt(i, M4); }
      leaves.instanceMatrix.needsUpdate = true; }
    if (flies) { const a = flies.geometry.attributes.position.array; for (let i = 0; i < a.length; i += 3) { a[i] += Math.sin(t * .6 + i) * .01; a[i + 1] += Math.cos(t * .9 + i * .7) * .006; }
      flies.geometry.attributes.position.needsUpdate = true; flies.material.opacity = .6 + Math.sin(t * 3) * .35; }
    for (let i = 0; i < KOI; i++) { const k = koi[i]; k.a += k.v * dt; const x = POND.x + Math.cos(k.a) * k.r, z = POND.z + Math.sin(k.a) * k.r;
      Qn.setFromAxisAngle(V.set(0, 1, 0), -k.a - Math.sign(k.v) * Math.PI / 2 + Math.sin(t * 6 + i) * .15); M4.compose(V.set(x, -.48, z), Qn, ONE); koiM.setMatrixAt(i, M4); }
    koiM.instanceMatrix.needsUpdate = true;
  }
  let best = null, bd = Infinity; for (const z of ZONES) { const d = Math.hypot(z.x - WK.x, z.z - WK.z); if (d < z.r && d < bd) { bd = d; best = z; } }
  if (best !== WK.zone) { WK.zone = best; const h = $('hint'); if (best) { h.innerHTML = `<b>E</b>${esc(best.name)} · ${esc(best.sub)}`; h.style.display = 'block'; } else h.style.display = 'none'; }
  if (bokeh.enabled) bokeh.uniforms.focus.value = camera.position.distanceTo(me.position) + .5;
  composer.render(); labels.render(scene, camera);
  fr++; const now = performance.now(); if (now - last >= 1000) { $('fps').textContent = Math.round(fr * 1000 / (now - last)) + ' fps'; fr = 0; last = now; }
});
build().catch(e => { $('load').textContent = 'Алдаа: ' + e.message; console.error(e); });
</script>
<script src="/nav.js" defer></script>
</body>
