<title>Moodboard атлас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Spectral:wght@500&display=swap">
<style>
:root{
  --bg:#EDEBE4;--surface:#F8F7F2;--raised:#E0DDD3;--line:#D2CFC4;
  --text:#141414;--text2:#66645D;--accent:#5F6E00;--accent-bg:#E4F25C;--on-accent:#111111;
  --web:#2F4BFF;--app:#1F8A4C;--mind:#C45A00;--news:#6A55D8;--studio:#0E8C99;--arc:#8A877F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121213;--surface:#1E1E20;--raised:#2A2A2D;--line:#38383C;--text:#F4F4EF;--text2:#9A9A95;--accent:#E4F25C;--accent-bg:#E4F25C;--on-accent:#111111;
  --web:#7E93FF;--app:#5FD38A;--mind:#FF9F5A;--news:#B9A8F0;--studio:#4FD1E0;--arc:#9A9A95;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121213;--surface:#1E1E20;--raised:#2A2A2D;--line:#38383C;--text:#F4F4EF;--text2:#9A9A95;--accent:#E4F25C;--accent-bg:#E4F25C;--on-accent:#111111;
  --web:#7E93FF;--app:#5FD38A;--mind:#FF9F5A;--news:#B9A8F0;--studio:#4FD1E0;--arc:#9A9A95;color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Onest",system-ui,sans-serif;padding:32px 20px 64px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font:500 clamp(34px,5vw,56px)/1.05 "Spectral",Georgia,serif;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:500 26px/1.2 "Spectral",Georgia,serif;margin:0}
.lede{color:var(--text2);max-width:68ch;margin:6px 0 0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text2)}
.num{font-variant-numeric:tabular-nums}
/* sources */
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.src:hover{border-color:var(--text2)}
.src:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.src b{font-size:30px;font-weight:600;line-height:1}
.src .where{font-size:12px;color:var(--text2)}
.src .name{font-weight:600}
/* filter */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:500 13px "Onest",sans-serif;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip[aria-pressed="true"]{background:var(--accent-bg);color:var(--on-accent);border-color:transparent}
.chip .c{color:inherit;opacity:.65}
.bar .sp{flex:1}
.count{color:var(--text2);font-size:13px}
/* sections */
section.s{display:flex;flex-direction:column;gap:14px}
.shead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.shead p{margin:0;color:var(--text2);font-size:13px;max-width:80ch}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.ghead span{color:var(--text2);font-weight:500}
.grid{columns:7 150px;column-gap:10px}
.tile{break-inside:avoid;margin:0 0 10px;display:block;width:100%;padding:0;border:0;background:var(--raised);border-radius:8px;overflow:hidden;cursor:zoom-in;position:relative}
.tile img{display:block;width:100%;height:auto}
.tile .g{position:absolute;left:6px;top:6px;width:9px;height:9px;border-radius:2px;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.empty{color:var(--text2);font-size:13px}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,10,10,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.lb figure{margin:0;max-width:min(520px,100%);background:var(--surface);border-radius:14px;overflow:hidden}
.lb img{width:100%;max-height:70vh;object-fit:contain;background:var(--raised);image-rendering:auto}
.lb figcaption{padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.lb figcaption span{color:var(--text2)}
.lb button{margin-top:6px;align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.tile img{transition:transform .2s}.tile:hover img{transform:scale(1.03)}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">BD · Inai · 2026-09-27</div>
    <h1>Moodboard атлас</h1>
    <p class="lede">Сүүлийн 2 сард цуглуулсан бүх moodboard нэг дор: Pinterest-ийн 3 board, Figma-ийн Just.Notion kit, Command Center-ийн судалгаа, сошиалаас хадгалсан пост. Зураг бүр Inai-ийн аль ажилд хэрэгтэйг өнгөөр тэмдэглэсэн.</p>
  </header>
  <div class="sources" id="sources"></div>
  <div class="legend" id="legend"></div>
  <div class="bar" role="toolbar" aria-label="Зорилгоор шүүх">
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:8px"></div><span class="sp"></span><span class="count num" id="count"></span>
  </div>
  <div id="sections" class="wrap" style="gap:40px"></div>
</div>
<div class="lb" id="lb" hidden><figure><img id="lbimg" alt=""><figcaption><strong id="lbt"></strong><span id="lbs"></span><button class="chip" id="lbc">Хаах</button></figcaption></figure></div>

<script>
const ITEMS=__ITEMS__;
const GOALS={web:['INAI Website','--web'],app:['Second Brain App','--app'],mind:['itge.e Mindset','--mind'],news:['Inai AI Newsletter','--news'],studio:['AI видео · Studio','--studio'],arc:['Archive','--arc']};
const SRC={
 pin:{name:'Pinterest · 3 board',where:'pinterest.com/ikhandmaa · Figma «Second Brain» → 🖼 Moodboards',note:'second-brain-inspo 19 · command-center 20 · everything-everywhere-all-at-once 231. 09-27-нд татаж зорилгоор ангилсан.'},
 jn:{name:'Just.Notion Brand Kit',where:'Figma «My Designs» → section 587:2',note:'Brand kit moodboard: фонт жишээ, app UI, кампанит зураг. Section-уудад «JN n» гэж нэмсэн.'},
 cc:{name:'Command Center «нэг самбар»',where:'vault · 08-Studio/CC нэг самбар/moodboard',note:'09-17-ны судалгаа: Elera, Railway canvas, Obsidian, Altari. 6 баганын зарчимтай (Moodboard.md).'},
 soc:{name:'Social saves',where:'vault · 08-Studio/Social saves/gallery',note:'Instagram, Threads, Facebook-ээс хадгалсан пост. Сэдэв нь нот бүрийн topic талбараас. Зорилгын өнгө нь сэдвээс таамагласан.'}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let goal='all';try{goal=localStorage.getItem('mb-goal')||'all'}catch(e){}
function counts(f){const c={};for(const x of ITEMS){if(f&&!f(x))continue;c[x.goal]=(c[x.goal]||0)+1;}return c;}
// sources
document.getElementById('sources').innerHTML=Object.entries(SRC).map(([k,s])=>{const n=ITEMS.filter(x=>x.src===k).length;return `<button class="src" data-jump="${k}"><span class="eyebrow">${esc(s.where.split(' · ')[0])}</span><b class="num">${n}</b><span class="name">${esc(s.name)}</span><span class="where">${esc(s.where)}</span></button>`}).join('')+
 `<div class="src" style="cursor:default"><span class="eyebrow">нийт</span><b class="num">${ITEMS.length}</b><span class="name">зураг, 4 эх сурвалж</span><span class="where">Vault-ын moodboard нот: EEAAO задаргаа (08-22), Command Center board (09-02), ангилал (09-27)</span></div>`;
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById('sec-'+b.dataset.jump).scrollIntoView({behavior:'smooth'}));
document.getElementById('legend').innerHTML=Object.entries(GOALS).map(([k,[n,v]])=>`<span><i style="background:var(${v})"></i>${n}</span>`).join('');
function renderChips(){const c=counts();const all=[['all','Бүгд',ITEMS.length,null],...Object.entries(GOALS).map(([k,[n,v]])=>[k,n,c[k]||0,v])];
 document.getElementById('chips').innerHTML=all.map(([k,n,x,v])=>`<button class="chip" id="chip-${k}" aria-pressed="${k===goal}" data-g="${k}">${v?`<i style="background:var(${v})"></i>`:''}${esc(n)} <span class="c num">${x}</span></button>`).join('');
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{goal=b.dataset.g;try{localStorage.setItem('mb-goal',goal)}catch(e){};renderChips();render();});}
function render(){const vis=ITEMS.filter(x=>goal==='all'||x.goal===goal);document.getElementById('count').textContent=vis.length+' зураг харагдаж байна';
 const out=[];for(const [k,s] of Object.entries(SRC)){const its=vis.filter(x=>x.src===k);const groups={};its.forEach((x,i)=>{(groups[x.sub]=groups[x.sub]||[]).push(x)});
  out.push(`<section class="s" id="sec-${k}"><div class="shead"><h2>${esc(s.name)}</h2><span class="count num">${its.length} / ${ITEMS.filter(x=>x.src===k).length}</span><p>${esc(s.note)}</p></div>`+
  (its.length?Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([g,xs])=>`<div class="group"><div class="ghead">${esc(g)} <span class="num">${xs.length}</span></div><div class="grid">${xs.map(x=>`<button class="tile" data-i="${ITEMS.indexOf(x)}" aria-label="${esc(x.t||x.n)}"><img src="${x.img}" alt="" loading="lazy"><i class="g" style="background:var(${GOALS[x.goal][1]})"></i></button>`).join('')}</div></div>`).join(''):`<div class="empty">Энэ зорилгод энэ эх сурвалжаас зураг алга.</div>`)+`</section>`);}
 document.getElementById('sections').innerHTML=out.join('');}
const lb=document.getElementById('lb');
document.getElementById('sections').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;const x=ITEMS[+t.dataset.i];document.getElementById('lbimg').src=x.img;document.getElementById('lbt').textContent=x.t||x.n;document.getElementById('lbs').textContent=SRC[x.src].name+' · '+x.sub+' · '+x.n+' · '+GOALS[x.goal][0];lb.hidden=false;document.getElementById('lbc').focus();});
lb.addEventListener('click',e=>{if(e.target===lb||e.target.id==='lbc')lb.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true;});
renderChips();render();
</script>
